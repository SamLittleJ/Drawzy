server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: let React Router handle every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
