[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
# A WebSocket test waiting for a message that never comes would otherwise hang forever.
timeout = 30

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
