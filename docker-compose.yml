# Full local stack: MySQL + FastAPI backend + React frontend.
#   docker compose up --build
# Frontend: http://localhost:3000   API docs: http://localhost:8080/docs

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: drawzy
      MYSQL_USER: drawzy
      MYSQL_PASSWORD: drawzy
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Ping over TCP: during first-run initialisation MySQL only listens on its socket.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udrawzy", "-pdrawzy"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: mysql+pymysql://drawzy:drawzy@db:3306/drawzy
      SECRET_KEY: local-development-secret-key-not-for-production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
